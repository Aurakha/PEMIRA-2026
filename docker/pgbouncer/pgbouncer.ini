[databases]
pemira_db = host=postgres port=5432 dbname=pemira_db auth_user=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Mode Transaction Pooling sangat krusial untuk jutaan transaksi cepat tanpa state session
pool_mode = transaction

; Batas koneksi klien (mampu melayani ribuan concurrent connection dari Fastify cluster)
max_client_conn = 5000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 5

; Resource tuning
max_db_connections = 100
server_idle_timeout = 60
server_connect_timeout = 15
server_login_retry = 1
query_timeout = 10
client_idle_timeout = 60
client_login_timeout = 15

; Log
admin_users = postgres
stats_users = postgres
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
