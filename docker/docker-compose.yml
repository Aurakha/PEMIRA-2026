version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pemira_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pemira_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - pemira_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pemira_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.22.0
    container_name: pemira_pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgrespassword123
      DB_HOST: postgres
      DB_NAME: pemira_db
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 5000
      DEFAULT_POOL_SIZE: 50
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pemira_net

  redis:
    image: redis:7.2-alpine
    container_name: pemira_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redispassword123 --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - pemira_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword123", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: pemira_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgrespassword123@pgbouncer:6432/pemira_db?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispassword123
      JWT_SECRET: super_secure_pemira_jwt_secret_key_2026_xyz
      VOTING_SECRET_KEY: server_blinded_receipt_salt_hash_key_2026
      GOOGLE_CLIENT_ID: mock_google_client_id_for_dev
      GOOGLE_CLIENT_SECRET: mock_google_client_secret_for_dev
      CLOUDFLARE_TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      ALLOWED_EMAIL_DOMAINS: "mahasiswa.ac.id,campus.ac.id,gmail.com"
    ports:
      - "4000:4000"
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - pemira_net

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: pemira_ballot_worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgrespassword123@pgbouncer:6432/pemira_db?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispassword123
      VOTING_SECRET_KEY: server_blinded_receipt_salt_hash_key_2026
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - pemira_net

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: pemira_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:80/api
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    ports:
      - "3000:3000"
    networks:
      - pemira_net

  nginx:
    image: nginx:1.25-alpine
    container_name: pemira_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - web
    networks:
      - pemira_net

networks:
  pemira_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
